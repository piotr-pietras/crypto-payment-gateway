services:
  api:
    build:
      context: .
      dockerfile: ./docker/dockerfile.api.dev
    container_name: crypto-payment-gateway-api
    env_file:
      - .env
    volumes:
      - ./api:/app
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./docker/dockerfile.web.dev
    container_name: crypto-payment-gateway-web
    env_file:
      - .env
    volumes:
      - ./web:/app
    networks:
      - internal
    depends_on:
      - api

  db:
    image: postgres:16-alpine
    container_name: crypto-payment-gateway-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: crypto_payment_gateway
    env_file:
      - .env
    volumes:
      - ./postgres_data_${ENV}:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30

  nginx:
    build:
      context: .
      dockerfile: ./docker/dockerfile.nginx
    container_name: crypto-payment-gateway-nginx
    env_file:
      - .env
    ports:
      - "7272:80"
    networks:
      - internal
    depends_on:
      - api
      - web

networks:
  internal:
    driver: bridge
