services:
  app:
    build:
      context: .
      dockerfile: ./docker/dockerfile.app
    # Set DOCKER_IMAGE=youruser/crypto-payment-gateway before push/pull
    image: ${DOCKER_IMAGE:-crypto-payment-gateway}:${TAG:-latest}
    container_name: crypto-payment-gateway-app
    environment:
      ENV: sepolia
      PHRASE: "material toward work rib online drive pear word still robot kid man"
      API_KEY: "test"
      ETHERSCAN_API_KEY: "RRCAAYF4G4SH6ZSD7ZY9GVJ6ITGGHFR378"
    ports:
      - "7272:80"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
    name: crypto_payment_gateway_pg
